[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citadel-predict-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Citadel Predict pre-execution AI agent cost estimation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Citadel Predict Team" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-desktop",
    "claude-code",
    "citadel-predict",
    "token-estimation",
    "agent-cost",
    "llm-budget",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "citadel-predict>=0.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
citadel-predict-mcp = "citadel_predict_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citadel_predict_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
