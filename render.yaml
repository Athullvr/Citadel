# Render Deployment Blueprint for Citadel Predict Backend API
#
# INSTRUCTIONS:
# 1. Connect this repository to your Render.com account.
# 2. Render will automatically detect this render.yaml blueprint and create the service.
# 3. In the Render Dashboard (Environment Variables tab):
#    - Set CITADEL_REQUIRE_AUTH=true (to enforce authentication in production).
#    - Set CITADEL_API_KEY=cp_live_<your-secure-key> (your production secret API key).
#    DO NOT commit production API keys to source control.

services:
  - type: web
    name: citadel-predict-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATA_COLLECTION_DIR
        value: ../data_collection
      # Production Security Configuration (Configure in Render Dashboard):
      # - CITADEL_REQUIRE_AUTH: Set to "true" to require Bearer tokens on /api/predict
      # - CITADEL_API_KEY: Set to your production API key (e.g. cp_live_...)
      - key: CITADEL_REQUIRE_AUTH
        sync: false
      - key: CITADEL_API_KEY
        sync: false
