name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Frozen Baseline Untouched
        run: |
          echo "🔍 Checking for accidental modifications to frozen baseline artifacts..."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_TARGET="origin/${{ github.base_ref }}"
          else
            # On direct push, compare with previous commit if available
            DIFF_TARGET="HEAD~1"
          fi

          if git rev-parse --verify "$DIFF_TARGET" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "$DIFF_TARGET"...HEAD 2>/dev/null || git diff --name-only "$DIFF_TARGET" HEAD)
            echo "Modified files in this commit/PR:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -E "^data_collection/calibration_data/claude-sonnet\.joblib$|^data_collection/data/runs\.jsonl$"; then
              echo "::error::CRITICAL VIOLATION: Modifications to frozen baseline artifacts (claude-sonnet.joblib or runs.jsonl) detected! See CLAUDE.md Invariant #1."
              exit 1
            fi
          else
            echo "Initial commit or shallow clone — skipping diff comparison."
          fi
          echo "✅ Frozen baseline is intact."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e packages/citadel-predict
          pip install -e packages/citadel-predict-mcp

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/ data_collection/features.py data_collection/predict.py packages/ scripts/

      - name: Run Mypy Type Check
        run: |
          mypy backend/main.py data_collection/features.py data_collection/predict.py

      - name: Run Full Pytest Suite
        run: |
          pytest -v

  frontend-ci:
    name: Frontend Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm run test

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: citadel-predict-api:test
