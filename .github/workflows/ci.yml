name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Frozen Baseline Untouched
        run: |
          echo "🔍 Checking for accidental modifications to frozen baseline artifacts..."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_TARGET="origin/${{ github.base_ref }}"
          else
            # On direct push, compare with previous commit if available
            DIFF_TARGET="HEAD~1"
          fi

          if git rev-parse --verify "$DIFF_TARGET" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "$DIFF_TARGET"...HEAD 2>/dev/null || git diff --name-only "$DIFF_TARGET" HEAD)
            echo "Modified files in this commit/PR:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -E "^data_collection/calibration_data/claude-sonnet\.joblib$|^data_collection/data/runs\.jsonl$"; then
              echo "::error::CRITICAL VIOLATION: Modifications to frozen baseline artifacts (claude-sonnet.joblib or runs.jsonl) detected! See CLAUDE.md Invariant #1."
              exit 1
            fi
          else
            echo "Initial commit or shallow clone — skipping diff comparison."
          fi
          echo "✅ Frozen baseline is intact."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        id: install-dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e packages/citadel-predict
          pip install -e packages/citadel-predict-mcp

      - name: Run Ruff Lint Check
        if: ${{ always() && steps.install-dependencies.outcome == 'success' }}
        run: |
          ruff check backend/ data_collection/features.py data_collection/predict.py packages/ scripts/

      - name: Run Mypy Type Check
        if: ${{ always() && steps.install-dependencies.outcome == 'success' }}
        run: |
          mypy backend/main.py data_collection/features.py data_collection/predict.py

      - name: Run Full Pytest Suite
        if: ${{ always() && steps.install-dependencies.outcome == 'success' }}
        run: |
          pytest -v

  postgres-integration:
    name: PostgreSQL Release Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build restartable PostgreSQL 16 test image
        run: docker build -f .github/postgres/Dockerfile -t citadel-postgres-ci .github/postgres

      - name: Start disposable PostgreSQL 16 service
        id: start-postgres
        env:
          POSTGRES_TEST_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --detach --init --name citadel-postgres \
            --env POSTGRES_DB=citadel_test \
            --env POSTGRES_USER=citadel_test \
            --env "POSTGRES_PASSWORD=$POSTGRES_TEST_PASSWORD" \
            --publish 127.0.0.1::5432 \
            --health-cmd "pg_isready -U citadel_test -d citadel_test" \
            --health-interval 5s --health-timeout 5s --health-retries 12 \
            citadel-postgres-ci
          container_id=$(docker inspect --format '{{.Id}}' citadel-postgres)
          host_port=$(docker port "$container_id" 5432/tcp | awk -F: '{print $NF}')
          echo "service_id=$container_id" >> "$GITHUB_OUTPUT"
          echo "port=$host_port" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 45); do
            if docker exec "$container_id" pg_isready -U citadel_test -d citadel_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run PostgreSQL schema and migration assertions independently
        run: pytest -v -s backend/tests/postgres/test_schema.py
        env:
          CITADEL_TEST_POSTGRES_URL: postgresql+psycopg://citadel_test:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:${{ steps.start-postgres.outputs.port }}/citadel_test

      - name: Run isolated PostgreSQL integration tests
        run: pytest -v -s -m postgres backend/tests/postgres
        env:
          CITADEL_TEST_POSTGRES_URL: postgresql+psycopg://citadel_test:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:${{ steps.start-postgres.outputs.port }}/citadel_test
          CITADEL_TEST_POSTGRES_SERVICE_ID: ${{ steps.start-postgres.outputs.service_id }}

      - name: Stop disposable PostgreSQL service
        if: always()
        run: docker rm --force citadel-postgres 2>/dev/null || true

  frontend-ci:
    name: Frontend Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install-dependencies
        run: npm ci

      - name: Run ESLint
        if: ${{ always() && steps.install-dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Run TypeScript Check
        if: ${{ always() && steps.install-dependencies.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        if: ${{ always() && steps.install-dependencies.outcome == 'success' }}
        run: npm run test

      - name: Build frontend
        if: ${{ always() && steps.install-dependencies.outcome == 'success' }}
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: citadel-predict-api:test

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: citadel-predict-frontend:test

      - name: Verify backend image starts without a database migration
        run: |
          docker run --rm -d --name citadel-backend-smoke -p 127.0.0.1:8000:8000 citadel-predict-api:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              docker stop citadel-backend-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs citadel-backend-smoke
          exit 1
