[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = [
    "backend/tests",
    "packages/citadel-predict/tests",
    "packages/citadel-predict-mcp/tests",
]
pythonpath = [
    "backend",
    "data_collection",
    "packages/citadel-predict/src",
    "packages/citadel-predict-mcp/src",
]
